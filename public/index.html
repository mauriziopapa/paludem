<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PALUDEM — Meeting Intelligence Engine</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="container">
    <h1><span>PALUDEM</span> Meeting Intelligence</h1>
    <p class="subtitle">PLAUD CLI &rarr; Transcript parsing &rarr; Enrichment &rarr; Dashboard</p>

    <!-- ═══ STATUS CARD ═══ -->
    <div class="card" id="statusCard">
      <h2>PLAUD Connection</h2>
      <div class="plaud-status" id="plaudStatus">
        <span class="loader"></span> Checking connection...
      </div>
      <div class="btn-row" style="margin-top:10px">
        <button class="btn btn-outline btn-sm" onclick="checkPlaudStatus()">Refresh Status</button>
      </div>
    </div>

    <!-- ═══ RECORDINGS CARD ═══ -->
    <div class="card">
      <h2>Registrazioni</h2>
      <div class="btn-row" style="margin-bottom:12px">
        <button class="btn btn-primary" onclick="loadRecordings()" id="btnLoad">Carica Lista</button>
        <button class="btn btn-outline" onclick="loadRecordings(true)" id="btnRefresh">Aggiorna</button>
        <span id="listStatus"></span>
      </div>
      <div id="recordingsTable">
        <div class="empty">Verifica la connessione PLAUD e carica la lista</div>
      </div>
      <div class="pagination hidden" id="pagination">
        <span id="pageInfo"></span>
        <div class="btn-row">
          <button class="btn btn-sm btn-outline" onclick="prevPage()" id="btnPrev" disabled>&laquo; Precedente</button>
          <button class="btn btn-sm btn-outline" onclick="nextPage()" id="btnNext">Successivo &raquo;</button>
        </div>
      </div>
    </div>

    <!-- ═══ LOG CARD ═══ -->
    <div class="card">
      <h2>Log</h2>
      <div id="log"><div class="log-entry" style="color:var(--text-muted)">In attesa...</div></div>
    </div>
  </div>

  <!-- ═══════════════════════════════════
       CONTENT MODAL — Multi-tab viewer
       ═══════════════════════════════════ -->
  <div class="modal-overlay" id="contentModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle">Contenuto</h3>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>

      <div class="modal-tabs" id="modalTabs">
        <button class="modal-tab active">Trascrizione</button>
        <button class="modal-tab">Sommario</button>
        <button class="modal-tab">Outline</button>
        <button class="modal-tab">Note</button>
        <button class="modal-tab">Raw</button>
      </div>

      <div class="modal-toolbar hidden" id="modalToolbar"></div>

      <div class="modal-body">
        <div id="modalBodyContent">
          <div class="empty">Seleziona una registrazione</div>
        </div>
      </div>

      <div class="modal-footer">
        <div class="modal-footer-left" id="modalFooterLeft"></div>
        <div class="modal-footer-right">
          <button class="btn btn-sm btn-outline" onclick="copyCurrentTab()">Copia</button>
          <button class="btn btn-sm btn-outline" onclick="exportTXT()">Esporta TXT</button>
          <button class="btn btn-sm btn-outline" onclick="exportJSON()">Esporta JSON</button>
          <button class="btn btn-sm btn-outline" onclick="closeModal()">Chiudi</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
